<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>دفتر سه‌بعدی نبض فردا</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
:root{--bg:#0E0B1F;--card:#17132fee;--line:#2a2450;--txt:#F4F2FB;--mut:#a9a3c9;--v:#6C47FF;--c:#22D3EE;--r:#FF4D6A}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Vazirmatn,sans-serif;overflow:hidden}
#scene{position:fixed;inset:0}#labels{position:fixed;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:12px;padding:2px 8px;border-radius:99px;background:#0E0B1Fcc;border:1px solid var(--line)}
.lbl.room{font-size:13px;color:var(--c);pointer-events:auto;cursor:pointer;font-weight:700}
.lbl.task{background:#6C47FFdd;border:0;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.bub{position:absolute;transform:translate(-50%,-100%);max-width:240px;white-space:normal;background:#F4F2FB;color:#0E0B1F;padding:8px 10px;border-radius:14px;font-size:12.5px;line-height:1.6;box-shadow:0 4px 20px #0008}
.bub:after{content:"";position:absolute;bottom:-6px;left:50%;border:6px solid transparent;border-top-color:#F4F2FB;border-bottom:0;margin-left:-6px}
header{position:fixed;top:0;right:0;left:0;display:flex;gap:10px;align-items:center;padding:10px 14px;background:linear-gradient(#0E0B1F,#0E0B1F00);z-index:3;flex-wrap:wrap}
h1{font-size:17px;margin:0}h1 b{background:linear-gradient(90deg,#6C47FF,#22D3EE);-webkit-background-clip:text;color:transparent}
header a,header button{color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font:inherit;font-size:13px;text-decoration:none;cursor:pointer}
#req{font-size:12.5px;color:var(--mut);flex-basis:100%}
#panel{position:fixed;top:0;bottom:0;left:0;width:360px;max-width:92vw;background:var(--card);backdrop-filter:blur(10px);border-right:1px solid var(--line);z-index:4;padding:14px;overflow:auto;transition:transform .3s}
#panel.hide{transform:translateX(-105%)}#panel h2{font-size:15px;margin:10px 0 8px}
.msg{background:#0E0B1F;border:1px solid var(--line);border-radius:12px;padding:7px 10px;margin-bottom:6px;font-size:13px;opacity:.45}.msg.on{opacity:1;border-color:var(--c)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:#6C47FF44;color:#d6ccff}
.col{margin-bottom:8px}.col h3{font-size:13px;margin:6px 0;color:var(--c)}.t{font-size:12.5px;background:#0E0B1F;border-radius:10px;padding:6px 8px;margin-bottom:4px;border-inline-start:3px solid var(--v)}
.t.approval{border-color:var(--r)}.foot{font-size:12px;color:var(--mut);margin-top:12px}
@media(max-width:700px){#panel{top:auto;height:48vh;width:100%;max-width:100%;border-right:0;border-top:1px solid var(--line)}#panel.hide{transform:translateY(105%)}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="scene"></div><div id="labels"></div>
<header><h1>دفتر سه‌بعدی <b>نبض فردا</b></h1><button id="tog">پنل</button><button id="home">نمای کل</button><a href="dashboard.html">داشبورد</a><div id="req"></div></header>
<aside id="panel"><h2>💬 <span id="mt">جلسه</span></h2><div id="chat"></div><h2>📋 کارها</h2><div id="kan"></div><div class="foot">By Yasin · <a style="color:var(--c)" href="https://nabz-farda.vercel.app/">nabz-farda.vercel.app</a> · <span id="upd"></span></div></aside>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;
document.getElementById('scene').appendChild(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0x0E0B1F);S.fog=new THREE.Fog(0x0E0B1F,40,80);
const cam=new THREE.PerspectiveCamera(45,1,.1,200);cam.position.set(-3,33,31);
const ctl=new OrbitControls(cam,R.domElement);ctl.target.set(innerWidth>700?-3:0,0,0);ctl.enableDamping=true;ctl.maxPolarAngle=1.35;ctl.minDistance=6;ctl.maxDistance=60;
S.add(new THREE.HemisphereLight(0xbfb4ff,0x0E0B1F,1.1));const sun=new THREE.DirectionalLight(0xffffff,1.3);sun.position.set(10,25,12);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-25,right:25,top:25,bottom:-25});S.add(sun);
const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.7,flatShading:true});
const box=(w,h,d,c,x,y,z,p=S)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;p.add(m);return m};
box(40,.4,30,0x17132f,0,-.2,0);
// rooms: id,name,x,z,w,d,color
const rooms={owner:['ورودی و جایگاه یاسین',-13,9,10,8,0x22D3EE],ceo:['دفتر مدیرعامل · nabz farda',0,9,12,8,0x6C47FF],meeting:['اتاق جلسه',13,9,10,8,0x22D3EE],
content:['اتاق مدیر محتوا',-12,-7,12,10,0x8b6cff],video:['اتاق مدیر ویدیو',0,-7,12,10,0x6C47FF],growth:['اتاق مدیر رشد',12,-7,12,10,0x8b6cff]};
const RP={},labels=document.getElementById('labels'),L=[];
const addLbl=(cls,html,obj,off)=>{const d=document.createElement('div');d.className='lbl '+cls;d.innerHTML=html;labels.appendChild(d);const o={d,obj,off};L.push(o);return o};
for(const[id,[n,x,z,w,d,c]]of Object.entries(rooms)){
  box(w-.4,.1,d-.4,0x221c45,x,.05,z);const wc=0x2a2450;
  box(w,2.2,.25,wc,x,1.1,z-d/2);box(.25,2.2,d,wc,x-w/2,1.1,z);box(.25,2.2,d,wc,x+w/2,1.1,z);
  box(w*.3,.12,.27,c,x-w*.3,.06,z+d/2);box(w*.3,.12,.27,c,x+w*.3,.06,z+d/2);
  const g=new THREE.Group();g.position.set(x,0,z);S.add(g);RP[id]={x,z,w,d,g};
  const lb=addLbl('room',E(n),g,new THREE.Vector3(0,2.9,-d/2));lb.d.onclick=()=>focus(id);
  const strip=box(w-.6,.08,.08,c,x,2.25,z-d/2+.15);strip.material.emissive=new THREE.Color(c);strip.material.emissiveIntensity=.8;
}
// meeting table
box(6,.15,2.6,0x3a2f7a,13,1,8.5);box(.3,1,.3,0x2a2450,13,.5,8.5);
const seats=[[-2,7],[0,7],[2,7],[-2,10],[0,10],[2,10]].map(([dx,z])=>new THREE.Vector3(13+dx,0,z));
// desks
const desks={};
const mkDesk=(id,x,z)=>{const g=new THREE.Group();g.position.set(x,0,z);S.add(g);
  const top=box(2.6,.12,1.2,0x3a2f7a,0,.95,0,g);box(.12,.9,1,0x2a2450,-1.2,.45,0,g);box(.12,.9,1,0x2a2450,1.2,.45,0,g);
  const scr=box(1,.65,.06,0x0E0B1F,0,1.4,-.4,g);scr.material.emissive=new THREE.Color(0x22D3EE);scr.material.emissiveIntensity=.15;
  const light=new THREE.PointLight(0x22D3EE,0,6);light.position.set(0,2,0);g.add(light);
  desks[id]={g,top,scr,light,seat:new THREE.Vector3(x,0,z+1.1)};};
mkDesk('owner',-13,8);mkDesk('ceo-bot',0,8);mkDesk('content',-12,-8);mkDesk('video',0,-8);mkDesk('growth',12,-8);
// avatars
const people={yasin:['یاسین 👑',0x22D3EE,'owner'],'ceo-bot':['nabz farda',0x6C47FF,'ceo-bot'],content:['مدیر محتوا',0xa58bff,'content'],video:['مدیر ویدیو',0x7c5cff,'video'],growth:['مدیر رشد',0x5ee0f5,'growth']};
const av={};let si=0;
for(const[id,[n,c,desk]]of Object.entries(people)){
  const g=new THREE.Group();const b=new THREE.Mesh(new THREE.CylinderGeometry(.35,.45,1.1,6),M(c));b.position.y=.75;b.castShadow=true;g.add(b);
  const h=new THREE.Mesh(new THREE.IcosahedronGeometry(.34,0),M(id=='yasin'?0xf2d2b6:0xdcd6ff));h.position.y=1.6;h.castShadow=true;g.add(h);
  if(id!='yasin'){const v=new THREE.Mesh(new THREE.BoxGeometry(.45,.12,.1),M(0x0E0B1F));v.material.emissive=new THREE.Color(0x22D3EE);v.position.set(0,1.63,.3);g.add(v)}
  else{const cr=new THREE.Mesh(new THREE.ConeGeometry(.22,.25,5),M(0xffd166));cr.position.y=2;g.add(cr)}
  const home=desks[desk].seat.clone();g.position.copy(home);g.rotation.y=Math.PI;S.add(g);
  av[id]={g,home,target:home.clone(),seat:seats[si++],name:addLbl('',E(n),g,new THREE.Vector3(0,2.35,0)),task:null,bub:null,desk};
}
// focus
let camT=null;const ctrT=new THREE.Vector3();
function focus(id){const r=RP[id];if(!r)return;ctrT.set(r.x,1,r.z);camT=new THREE.Vector3(r.x,9,r.z+11)}
document.getElementById('home').onclick=()=>{ctrT.set(0,0,0);camT=new THREE.Vector3(0,26,26)};
document.getElementById('tog').onclick=()=>document.getElementById('panel').classList.toggle('hide');
if(innerWidth<700)document.getElementById('panel').classList.add('hide');
const ray=new THREE.Raycaster(),mp=new THREE.Vector2();let down;
R.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
R.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return;
  mp.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(mp,cam);const p=new THREE.Vector3();
  if(ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0),p))for(const[id,r]of Object.entries(rooms)){if(Math.abs(p.x-r[1])<r[3]/2&&Math.abs(p.z-r[2])<r[4]/2)focus(id)}});
// data
const nameOf=w=>people[w]?.[0]||w;let live=null,msgs=[],mi=0,lastKey='';
async function poll(){try{
  const [l,t]=await Promise.all(['live','tasks'].map(f=>fetch('data/'+f+'.json?'+Date.now()).then(r=>r.json())));live=l;
  document.getElementById('req').textContent=l.yasin_request?'آخرین درخواست یاسین: '+l.yasin_request:'';
  document.getElementById('upd').textContent=l.updated?new Date(l.updated).toLocaleString('fa-IR'):'';
  for(const[id,a]of Object.entries(l.agents||{})){const A=av[id];if(!A)continue;const D=desks[A.desk];
    if(a.state=='in_meeting'||a.location=='meeting')A.target.copy(A.seat);else if(RP[a.location]&&!desks[id]){A.target.set(RP[a.location].x,0,RP[a.location].z+1)}else A.target.copy(A.home);
    const w=a.state=='working';D.light.intensity=w?6:0;D.scr.material.emissiveIntensity=w?1.2:.15;D.top.material.emissive=new THREE.Color(w?0x22D3EE:0);D.top.material.emissiveIntensity=w?.35:0;
    if(w&&a.task){if(!A.task)A.task=addLbl('task','',D.g,new THREE.Vector3(0,2.6,0));A.task.d.textContent='⚙️ '+a.task;A.task.d.style.display=''}else if(A.task)A.task.d.style.display='none';}
  const inMeet=Object.values(l.agents||{}).some(a=>a.state=='in_meeting');av.yasin.target.copy(av.yasin.home);
  msgs=inMeet?(l.meeting?.messages||[]):[];document.getElementById('mt').textContent=l.meeting?.title||'جلسه';
  const key=JSON.stringify(l.meeting);if(key!=lastKey){lastKey=key;mi=0;renderChat()}
  const cols={todo:'برای انجام',doing:'در حال انجام',approval:'منتظر تأیید یاسین',done:'انجام شد'};
  document.getElementById('kan').innerHTML=Object.entries(cols).map(([k,v])=>{const ts=t.tasks.filter(x=>x.status==k);return `<div class="col"><h3>${v} (${ts.length})</h3>${ts.map(x=>`<div class="t ${k}">${E(x.title)} <span class="tag">${E(nameOf(x.owner))}</span></div>`).join('')}</div>`}).join('');
}catch(e){console.warn(e)}}
function renderChat(){document.getElementById('chat').innerHTML=(live?.meeting?.messages||[]).map((m,i)=>`<div class="msg ${msgs.length&&i<=mi?'on':''}"><span class="tag">${E(nameOf(m.who))}</span> ${E(m.text)}</div>`).join('')}
let bubT=0;
function bubbles(dt){for(const A of Object.values(av))if(A.bub)A.bub.d.style.display='none';if(!msgs.length)return;
  const m=msgs[mi%msgs.length],A=av[m.who];if(A&&A.g.position.distanceTo(A.target)<.3){bubT+=dt;
    if(!A.bub){A.bub=addLbl('','',A.g,new THREE.Vector3(0,2.9,0));A.bub.d.className='bub'}A.bub.d.textContent=m.text;A.bub.d.style.display='';
    if(bubT>4.5){bubT=0;mi=(mi+1)%msgs.length;renderChat()}}else if(!A){mi=(mi+1)%msgs.length}}
window.__dbg=()=>Object.fromEntries(Object.entries(av).map(([k,A])=>[k,[A.g.position.toArray(),A.target.toArray()]]));
poll();setInterval(poll,5000);
// loop
const clk=new THREE.Clock(),tmp=new THREE.Vector3();
function size(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',size);size();
R.setAnimationLoop(()=>{const dt=Math.min(clk.getDelta(),.1),t=clk.elapsedTime;
  for(const A of Object.values(av)){tmp.subVectors(A.target,A.g.position);tmp.y=0;const d=tmp.length();
    if(d>.05){const s=Math.min(d,dt*5);tmp.normalize();A.g.position.addScaledVector(tmp,s);A.g.rotation.y=Math.atan2(tmp.x,tmp.z);A.g.position.y=Math.abs(Math.sin(t*10))*.12}
    else{A.g.position.y=Math.sin(t*2+A.home.x)*.03;const mt=RP.meeting;if(A.target.equals(A.seat))A.g.rotation.y=Math.atan2(mt.x-A.g.position.x,8.5-A.g.position.z);else if(A.target.equals(A.home))A.g.rotation.y=Math.PI}}
  bubbles(dt);if(camT){cam.position.lerp(camT,.06);ctl.target.lerp(ctrT,.06);if(cam.position.distanceTo(camT)<.1)camT=null}
  ctl.update();R.render(S,cam);
  const W=innerWidth,H=innerHeight;for(const o of L){if(o.d.style.display=='none')continue;const p=o.off.clone();o.obj.localToWorld(p);p.project(cam);
    const vis=p.z<1&&p.z>-1;o.d.style.visibility=vis?'visible':'hidden';o.d.style.left=(p.x*.5+.5)*W+'px';o.d.style.top=(-p.y*.5+.5)*H+'px'}});
</script></body></html>
