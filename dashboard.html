<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>شرکت مجازی نبض فردا</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
:root{--bg:#0E0B1F;--card:#17132f;--line:#2a2450;--txt:#F4F2FB;--mut:#a9a3c9;--v:#6C47FF;--c:#22D3EE;--r:#FF4D6A;--g:linear-gradient(90deg,#6C47FF,#22D3EE)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Vazirmatn,sans-serif;line-height:1.7}
header{position:sticky;top:0;background:#0E0B1Fe6;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:5}
.wrap{max-width:1150px;margin:auto;padding:0 16px}.top{display:flex;align-items:center;gap:12px;padding:12px 0;flex-wrap:wrap}
h1{font-size:20px;margin:0}h1 b{background:var(--g);-webkit-background-clip:text;color:transparent}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-inline-start:auto}nav a{color:var(--mut);text-decoration:none;padding:6px 12px;border-radius:99px;font-size:14px}
nav a.on{background:var(--g);color:#fff}section{display:none;padding:24px 0}section.on{display:block}
h2{font-size:18px;margin:0 0 14px}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.mut{color:var(--mut);font-size:13px}
.tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;background:#6C47FF33;color:#c9bbff}.tag.c{background:#22D3EE22;color:var(--c)}
.org{display:flex;flex-direction:column;align-items:center;gap:18px}.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.node{min-width:200px;max-width:280px;text-align:center}.node.top1{border-color:var(--c)}.node.top2{border-image:var(--g) 1}
.av{width:44px;height:44px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:var(--g);font-weight:800}
.conn{width:2px;height:18px;background:var(--g);margin:-18px auto 0}
.kan{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}@media(max-width:860px){.kan{grid-template-columns:1fr 1fr}}@media(max-width:520px){.kan{grid-template-columns:1fr}}
.col{background:#120f27;border:1px solid var(--line);border-radius:16px;padding:10px}.col h3{font-size:14px;margin:4px 6px 10px;display:flex;justify-content:space-between}
.task{margin-bottom:8px}.task.approval{border-inline-start:3px solid var(--r)}.task.done{opacity:.8;border-inline-start:3px solid var(--c)}
.feed .card{display:flex;gap:10px;margin-bottom:8px;align-items:flex-start}
ul{margin:6px 0;padding-inline-start:20px}footer{text-align:center;color:var(--mut);padding:30px;font-size:13px}
</style></head><body>
<header><div class="wrap top"><h1>شرکت مجازی <b>نبض فردا</b></h1>
<nav id="nav"><a data-s="org" class="on">تیم</a><a data-s="meet">جلسه‌ها</a><a data-s="proj">پروژه‌ها</a><a data-s="tasks">کارها</a><a data-s="feed">فعالیت‌ها</a></nav></div></header>
<main class="wrap">
<section id="org" class="on"><h2>چارت سازمانی</h2><div class="org" id="orgc"></div></section>
<section id="meet"><h2>جلسه‌ها</h2><div id="meetc"></div></section>
<section id="proj"><h2>طرح‌ها و پروژه‌ها</h2><div class="grid" id="projc"></div></section>
<section id="tasks"><h2>تابلوی کارها</h2><div class="kan" id="kanc"></div></section>
<section id="feed"><h2>فعالیت‌های اخیر</h2><div class="feed" id="feedc"></div></section>
</main><footer>By Yasin · <a style="color:var(--c)" href="https://nabz-farda.vercel.app/">nabz-farda.vercel.app</a> · <span id="upd"></span></footer>
<script>
const $=id=>document.getElementById(id),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fa=d=>new Date(d).toLocaleDateString('fa-IR');
document.querySelectorAll('#nav a').forEach(a=>a.onclick=()=>{document.querySelectorAll('#nav a,section').forEach(x=>x.classList.remove('on'));a.classList.add('on');$(a.dataset.s).classList.add('on');location.hash=a.dataset.s});
Promise.all(['company','meetings','tasks'].map(f=>fetch('data/'+f+'.json?'+Date.now()).then(r=>r.json()))).then(([co,me,tk])=>{
const P={};co.people.forEach(p=>P[p.id]=p);const nm=id=>P[id]?P[id].name:id;
const node=(p,c='')=>`<div class="card node ${c}"><div class="av">${p.type=='human'?'👑':'🤖'}</div><b>${E(p.name)}</b><div><span class="tag ${p.type=='human'?'c':''}">${E(p.role)}</span></div><div class="mut">${E(p.desc)}</div></div>`;
const top=co.people.filter(p=>!p.reports),mid=co.people.filter(p=>top.some(t=>t.id==p.reports)),low=co.people.filter(p=>mid.some(t=>t.id==p.reports));
$('orgc').innerHTML=`<div class="row">${top.map(p=>node(p,'top1')).join('')}</div><div class="row">${mid.map(p=>node(p,'top2')).join('')}</div><div class="row">${low.map(p=>node(p)).join('')}</div>`;
$('meetc').innerHTML=me.map(m=>`<div class="card" style="margin-bottom:12px"><div class="mut">${fa(m.date)}</div><h3 style="margin:2px 0 8px">${E(m.title)}</h3><p><b>بریف:</b> ${E(m.brief)}</p><b>نظر مدیرها:</b><ul>${m.inputs.map(i=>`<li><span class="tag">${E(nm(i.who))}</span> ${E(i.text)}</li>`).join('')}</ul><b>طرح نهایی:</b><ul>${m.plan.map(x=>`<li>${E(x)}</li>`).join('')}</ul></div>`).join('');
const cols={todo:'برای انجام',doing:'در حال انجام',approval:'منتظر تأیید یاسین',done:'انجام شد'};
$('projc').innerHTML=co.projects.map(p=>{const t=tk.tasks.filter(x=>x.project==p.id);return `<div class="card"><b>${E(p.title)}</b><div class="mut">${E(p.desc)}</div><div style="margin-top:8px"><span class="tag">${E(nm(p.owner))}</span> <span class="tag c">${t.length} کار</span></div></div>`}).join('');
$('kanc').innerHTML=Object.entries(cols).map(([k,v])=>{const t=tk.tasks.filter(x=>x.status==k);return `<div class="col"><h3>${v}<span class="tag">${t.length}</span></h3>${t.map(x=>`<div class="card task ${k}"><div>${E(x.title)}</div><span class="tag">${E(nm(x.owner))}</span>${x.recurring?' <span class="tag c">روزانه</span>':''}</div>`).join('')||'<div class="mut" style="padding:6px">—</div>'}</div>`}).join('');
$('feedc').innerHTML=tk.activity.map(a=>`<div class="card"><div class="av" style="margin:0;flex:none;width:34px;height:34px">🤖</div><div><b>${E(nm(a.who))}</b> <span class="mut">${fa(a.date)}</span><div>${E(a.text)}</div></div></div>`).join('');
$('upd').textContent='به‌روزرسانی: '+fa(co.updated);
const h=location.hash.slice(1);if(h)document.querySelector(`#nav a[data-s="${h}"]`)?.click();
});
</script></body></html>
